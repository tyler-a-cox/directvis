[build-system]
requires = ["setuptools>=77", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
fallback_version = "0.1.0"

[project]
name = "directvis"
description = "Direct-summation visibility simulator for a few point sources, with an fftvis-compatible API"
readme = "README.md"
authors = [
    {name = "Tyler Cox", email = "tyler.a.cox@berkeley.edu"},
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "numpy",
    "scipy",
    "astropy",
    "pyuvdata>=3.1.2",
    "matvis>=1.3.2",
]
dynamic = ["version"]

[project.optional-dependencies]
test = [
    "pytest",
    "fftvis",
    "pyradiosky",
    "pyuvsim",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
